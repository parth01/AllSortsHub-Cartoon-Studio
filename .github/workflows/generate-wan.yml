name: Generate Episode 1 — Wan 2.2 AI Animation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate first 3 shots for testing, or the complete 17-shot episode
        required: true
        default: test3
        type: choice
        options:
          - test3
          - full

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate Wan 2.2 animation clips
        working-directory: master-version/AllSortsHub-Billion 2
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python3 wan_i2v/replicate_generate.py ${{ inputs.mode }}

      - name: Assemble generated animation with audio and captions
        working-directory: master-version/AllSortsHub-Billion 2
        run: |
          if [ "${{ inputs.mode }}" = "test3" ]; then
            python3 wan_i2v/assemble_test3.py
          else
            python3 wan_i2v/assemble_episode.py
          fi

      - name: Validate outputs
        working-directory: master-version/AllSortsHub-Billion 2/output
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "test3" ]; then
            test -s AllSortsHub_Episode_01_WAN_TEST3.mp4
          else
            test -s AllSortsHub_Episode_01_WAN_MASTER.mp4
            test -s AllSortsHub_Episode_01_WAN_VERTICAL_9x16.mp4
          fi
          ls -lh *.mp4

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllSortsHub-Episode-01-Wan-${{ inputs.mode }}
          path: master-version/AllSortsHub-Billion 2/output/*.mp4
          if-no-files-found: error
          retention-days: 14
