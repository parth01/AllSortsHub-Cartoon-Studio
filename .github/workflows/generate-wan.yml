name: Generate Episode 1 — Free Wan 2.2 AI Animation

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Video generation backend
        required: true
        default: magichour
        type: choice
        options:
          - magichour
          - huggingface
      mode:
        description: Generate a small test, selected shot range, or the complete 17-shot episode
        required: true
        default: full
        type: choice
        options:
          - test3
          - range
          - full
      shot_start:
        description: First shot to generate when mode is range (1-17)
        required: false
        default: "4"
        type: string
      shot_end:
        description: Last shot to generate when mode is range (1-17)
        required: false
        default: "4"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install generation client
        run: |
          python3 -m pip install --upgrade pip
          if [ "${{ inputs.backend }}" = "magichour" ]; then
            python3 -m pip install magic_hour
          else
            python3 -m pip install gradio_client
          fi

      - name: Verify generation authentication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
        run: |
          if [ "${{ inputs.backend }}" = "magichour" ]; then
            test -n "$MAGIC_HOUR_API_KEY"
            echo "MAGIC_HOUR_API_KEY is configured."
          else
            test -n "$HF_TOKEN"
            echo "HF_TOKEN is configured."
          fi

      - name: Recover previous partial clips
        if: inputs.mode == 'range'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: master-version/AllSortsHub-Billion 2
        run: |
          mkdir -p wan_i2v/generated
          ARTIFACT_NAME="AllSortsHub-Episode-01-Wan-Progress-${{ inputs.shot_start }}-${{ inputs.shot_end }}"
          echo "Looking for previous progress artifact: $ARTIFACT_NAME"
          PREV_RUN=$(gh run list --workflow generate-wan.yml --branch main --limit 20 --json databaseId,status,conclusion --jq '[.[] | select(.databaseId != ('"$GITHUB_RUN_ID"') and (.conclusion == "failure" or .conclusion == "success"))][0].databaseId // empty')
          if [ -n "$PREV_RUN" ]; then
            echo "Trying previous workflow run $PREV_RUN"
            gh run download "$PREV_RUN" --name "$ARTIFACT_NAME" --dir wan_i2v/generated || true
          else
            echo "No previous completed run found. Starting fresh."
          fi
          find wan_i2v/generated -maxdepth 1 -type f -name '*.mp4' -printf '%f %s bytes\n' | sort || true

      - name: Generate with Magic Hour Wan 2.2
        if: inputs.backend == 'magichour'
        working-directory: master-version/AllSortsHub-Billion 2
        env:
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          SHOT_START: ${{ inputs.shot_start }}
          SHOT_END: ${{ inputs.shot_end }}
        run: python3 wan_i2v/magichour_generate.py ${{ inputs.mode }}

      - name: Generate with Hugging Face Wan 2.2
        if: inputs.backend == 'huggingface'
        working-directory: master-version/AllSortsHub-Billion 2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHOT_START: ${{ inputs.shot_start }}
          SHOT_END: ${{ inputs.shot_end }}
        run: python3 wan_i2v/huggingface_generate.py ${{ inputs.mode }}

      - name: Save generation progress
        if: always() && inputs.mode == 'range'
        uses: actions/upload-artifact@v4
        with:
          name: AllSortsHub-Episode-01-Wan-Progress-${{ inputs.shot_start }}-${{ inputs.shot_end }}
          path: master-version/AllSortsHub-Billion 2/wan_i2v/generated/*.mp4
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload generated clips
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AllSortsHub-Episode-01-Wan-Shots-${{ inputs.backend }}-${{ inputs.shot_start }}-${{ inputs.shot_end }}
          path: master-version/AllSortsHub-Billion 2/wan_i2v/generated/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Assemble selected shots for review
        if: success() && inputs.mode == 'range'
        working-directory: master-version/AllSortsHub-Billion 2
        env:
          SHOT_START: ${{ inputs.shot_start }}
          SHOT_END: ${{ inputs.shot_end }}
        run: python3 wan_i2v/assemble_range.py

      - name: Assemble first 3 shots for review
        if: success() && inputs.mode == 'test3'
        working-directory: master-version/AllSortsHub-Billion 2
        run: python3 wan_i2v/assemble_test3.py

      - name: Assemble complete episode
        if: success() && inputs.mode == 'full'
        working-directory: master-version/AllSortsHub-Billion 2
        run: python3 wan_i2v/assemble_episode.py

      - name: Validate outputs
        if: success()
        working-directory: master-version/AllSortsHub-Billion 2/output
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "test3" ]; then
            test -s AllSortsHub_Episode_01_WAN_TEST3.mp4
          elif [ "${{ inputs.mode }}" = "range" ]; then
            test -s AllSortsHub_Episode_01_WAN_RANGE_${{ inputs.shot_start }}_${{ inputs.shot_end }}.mp4
          else
            test -s AllSortsHub_Episode_01_WAN_MASTER.mp4
            test -s AllSortsHub_Episode_01_WAN_VERTICAL_9x16.mp4
          fi
          ls -lh *.mp4

      - name: Upload final Episode 1 video
        if: success() && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: AllSortsHub-Episode-01-FINAL
          path: |
            master-version/AllSortsHub-Billion 2/output/AllSortsHub_Episode_01_WAN_MASTER.mp4
            master-version/AllSortsHub-Billion 2/output/AllSortsHub_Episode_01_WAN_VERTICAL_9x16.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Upload review video
        if: success() && inputs.mode != 'full'
        uses: actions/upload-artifact@v4
        with:
          name: AllSortsHub-Episode-01-Wan-Review-${{ inputs.backend }}-${{ inputs.mode }}-${{ inputs.shot_start }}-${{ inputs.shot_end }}
          path: master-version/AllSortsHub-Billion 2/output/*.mp4
          if-no-files-found: error
          retention-days: 30
