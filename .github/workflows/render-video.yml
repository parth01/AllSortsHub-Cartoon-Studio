name: Render Cartoon Episode

on:
  workflow_dispatch:
  push:
    paths:
      - 'episode_*.json'
      - 'studio.py'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render episode
        run: python studio.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: AllSortsHub-Episode-01
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
